name: StockMind AI 4.0 Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stockmind-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run StockMind Scanner
        run: python scanner.py

      - name: Save market data
        run: |
          git config user.name "StockMind Bot"
          git config user.email "stockmind@users.noreply.github.com"
          git add -- '*.csv' '*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Update StockMind market data"
            git pull --rebase origin main
            git push origin main
          fi
