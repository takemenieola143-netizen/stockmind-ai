
name: StockMind Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stockmind-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install market data library
        run: pip install yfinance

      - name: Run stock scanner
        run: python scanner.py

      - name: Save market data
        run: |
          git config user.name "StockMind Bot"
          git config user.email "stockmind-bot@users.noreply.github.com"
          git add market_data.csv
          if git diff --cached --quiet; then
            echo "No new market data"
          else
            git commit -m "Update market data"
            git push
          fi
