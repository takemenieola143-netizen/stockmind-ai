name: StockMind AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stockmind-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scikit-learn requests

      - name: Run StockMind AI Scanner
        env:
          MAX_SYMBOLS: '0'
          PYTHONUNBUFFERED: '1'
        run: python scanner.py

      - name: Save market data
        run: |
          git config user.name "StockMind AI"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.json' '*.csv'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update StockMind AI market data"
            git push
          fi
