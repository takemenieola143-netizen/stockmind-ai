
name: StockMind AI Scanner

on:
  workflow_dispatch:
    inputs:
      test_v6:
        description: Test only - do not publish
        type: boolean
        default: true
      max_symbols:
        description: Stock limit (0 = Full market)
        type: string
        default: '0'

  schedule:
    - cron: '30 11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stockmind-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance
          pip install scikit-learn requests
          pip install xgboost lightgbm catboost

      - name: Activate StockMind AI 6.0
        run: |
          python -m py_compile ai_engine.py
          python upgrade_scanner.py
          python -m py_compile scanner.py

      - name: Run AI market scanner
        env:
          MAX_SYMBOLS: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_v6 && inputs.max_symbols) || '0' }}
        run: |
          rm -f market_data.json market_data.csv
          python scanner.py

      - name: Verify AI report
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("market_data.json") as f:
              data = json.load(f)

          assert str(data.get("version")) == "6.0"
          assert data.get("stocks")
          assert "ai_diagnostics" in data
          assert data.get("connected", 0) > 0

          for h in ("1", "5", "10", "20"):
              assert h in data["ai_diagnostics"]

          print("Version 6.0 report verified")
          print("Stocks requested:", data["requested"])
          print("Stocks connected:", data["connected"])

          for h, d in data["ai_diagnostics"].items():
              print("Horizon:", h)
              print("Selected models:", d.get("selected_models"))
              print("Evaluation:", d.get("evaluation"))
              print("Reliable:", d.get("reliable"))

          dates = [s["date"] for s in data["stocks"] if s.get("date")]
          latest = max(dates)
          print("Latest market date:", latest)
          PY

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: stockmind-v6-report
          path: |
            market_data.json
            market_data.csv

      - name: Production safety check
        if: ${{ github.event_name == 'schedule' || !inputs.test_v6 }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("market_data.json") as f:
              data = json.load(f)

          assert data["requested"] >= 2000
          assert data["connected"] >= 2000
          assert data["connected"] / data["requested"] >= 0.90

          today = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).date().isoformat()

          stocks = data["stocks"]
          fresh = sum(
              s.get("date") == today
              for s in stocks
          )

          assert fresh / len(stocks) >= 0.90, (
              "Stale market data. Publication blocked."
          )

          print("Production safety checks passed")
          PY

      - name: Publish StockMind AI 6.0
        if: ${{ github.event_name == 'schedule' || !inputs.test_v6 }}
        run: |
          git config user.name "StockMind AI"
          git config user.email "actions@users.noreply.github.com"

          git add market_data.json market_data.csv

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update StockMind AI 6.0 market data"
            git push
          fi
