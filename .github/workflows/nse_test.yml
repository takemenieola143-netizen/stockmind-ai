
name: StockMind AI NSE Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nse-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate NSE engine
        run: python -m py_compile nse_data.py

      - name: Test official NSE data
        run: python nse_data.py DIXON 2026-11-25
