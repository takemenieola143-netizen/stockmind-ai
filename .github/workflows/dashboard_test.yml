name: StockMind AI 7.2 Dashboard Checks

on:
  push:
    branches:
      - stockmind-7-2-dashboard
      - stockmind-8-1-mobile
      - stockmind-8-2-research
    paths:
      - index.html
      - stock_dashboard.js
      - tests/stock_dashboard.test.js
      - export_market_charts.py
      - tests/test_export_market_charts.py
      - research_engine_v8.py
      - personal_data_adapter.py
      - tests/test_data_forecasts.py
      - research_scale_test.py
      - tests/test_research_engine_v8.py
      - market_chart_upgrade.py
      - research.html
      - company_research.html
      - company_research.js
      - tests/company_research.test.js
      - .github/workflows/dashboard_test.yml
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - stock_dashboard.js
      - tests/stock_dashboard.test.js
      - export_market_charts.py
      - tests/test_export_market_charts.py
      - research_engine_v8.py
      - personal_data_adapter.py
      - tests/test_data_forecasts.py
      - research_scale_test.py
      - tests/test_research_engine_v8.py
      - market_chart_upgrade.py
      - research.html
      - company_research.html
      - company_research.js
      - tests/company_research.test.js
      - .github/workflows/dashboard_test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate chart export
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify full-universe research capacity (synthetic charts)
        run: python research_scale_test.py
      - name: Validate JavaScript syntax
        run: node --check stock_dashboard.js
      - name: Run dashboard tests
        run: node --test tests/*.test.js
      - name: Validate company research syntax
        run: node --check company_research.js
