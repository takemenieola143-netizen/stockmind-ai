name: StockMind AI 7.2 Dashboard Checks

on:
  push:
    branches:
      - stockmind-7-2-dashboard
    paths:
      - index.html
      - stock_dashboard.js
      - tests/stock_dashboard.test.js
      - .github/workflows/dashboard_test.yml
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - stock_dashboard.js
      - tests/stock_dashboard.test.js
      - .github/workflows/dashboard_test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check stock_dashboard.js
      - name: Run dashboard tests
        run: node --test tests/stock_dashboard.test.js
