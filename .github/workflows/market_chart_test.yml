
name: StockMind AI 7.1 Market Chart Test

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "100 = Sample test, 0 = Full market"
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  market-chart-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance
          pip install scikit-learn requests
          pip install xgboost lightgbm catboost

      - name: Activate AI 6.0
        run: python upgrade_scanner.py

      - name: Activate full market charts
        run: |
          python market_chart_upgrade.py
          python -m py_compile scanner.py

      - name: Scan stocks
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
        run: |
          rm -f market_data.json market_charts.json
          python scanner.py

      - name: Verify market charts
        run: |
          python - <<'PY'
          import json

          with open("market_data.json") as f:
              market = json.load(f)

          with open("market_charts.json") as f:
              report = json.load(f)

          charts = report["charts"]

          stocks = {
              s["symbol"]: s
              for s in market["stocks"]
          }

          assert report["version"] == "7.1"
          assert len(stocks) > 0
          assert len(charts) > 0

          assert len(charts) / len(stocks) >= 0.90

          for symbol, chart in charts.items():

              assert symbol in stocks
              assert chart["symbol"] == symbol
              assert chart["decision"] == "WAIT"

              candles = chart["candles"]
              assert 51 <= len(candles) <= 90

              dates = [c["date"] for c in candles]

              assert dates == sorted(set(dates))
              assert dates[-1] == chart["price_date"]

              if chart["freshness_verified"]:

                  assert chart["price_date"] == stocks[symbol]["date"]

                  assert abs(
                      chart["close"]
                      - stocks[symbol]["price"]
                  ) <= 0.05

              else:
                  assert chart["reference_plan"] is None

          print("Stocks scanned:", len(stocks))
          print("Charts generated:", len(charts))
          print("Verified charts:",
                report["freshness_verified"])
          print("Unverified charts:",
                report["freshness_unverified"])
          print("Chart failures:",
                len(report["failed"]))

          from collections import Counter

          print("Chart trading dates:",
                Counter(c["price_date"]
                        for c in charts.values()))

          print("Scanner trading dates:",
                Counter(s["date"]
                        for s in stocks.values()))

          print("Freshness failure reasons:",
                Counter(c["freshness_reason"]
                        for c in charts.values()
                        if not c["freshness_verified"]))


          print("MARKET CHART TEST PASSED")
          PY
          

      - name: Test market-wide candle recovery
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from nse_batch import download_nse_market
          from chart_engine import recover_missing_candle

          expected = "2026-11-25"
          previous = "2026-11-23"

          now = datetime.now(
              ZoneInfo("Asia/Kolkata")
          )

          with open("market_charts.json") as f:
              report = json.load(f)

          charts = report["charts"]

          nse = download_nse_market(expected)

          counts = Counter()
          failures = Counter()

          for symbol, chart in charts.items():

              candle = nse.get(symbol)

              if candle is None:
                  counts["NSE unavailable"] += 1
                  continue

              counts["NSE matched"] += 1

              if chart["price_date"] == expected:

                  if abs(
                      chart["close"] - candle["close"]
                  ) <= 0.05:

                      counts["Already current"] += 1

                  else:
                      counts["Price mismatch"] += 1

                  continue

              if chart["price_date"] != previous:
                  counts["Other trading date"] += 1
                  continue

              counts["Recovery attempted"] += 1

              try:

                  recovered = recover_missing_candle(
                      chart,
                      candle,
                      previous,
                      expected,
                      now
                  )

                  assert recovered["price_date"] == expected

                  assert abs(
                      recovered["close"] - candle["close"]
                  ) <= 0.05

                  assert recovered["recovered_candle"]

                  assert recovered["decision"] == "WAIT"

                  assert recovered["reference_plan"] is None

                  counts["Recovered"] += 1

              except Exception as error:

                  counts["Recovery failed"] += 1
                  failures[str(error)] += 1

          print("MARKET RECOVERY RESULTS")
          print("Total charts:", len(charts))

          for key, value in sorted(counts.items()):
              print(key + ":", value)

          print("Failure reasons:", dict(failures))

          assert counts["NSE matched"] > 0

          assert counts["Recovery failed"] == 0

          assert (
              counts["Recovered"]
              == counts["Recovery attempted"]
          )

          print("MARKET RECOVERY TEST PASSED")
          PY

