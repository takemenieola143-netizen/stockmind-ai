
name: StockMind AI Chart Intelligence

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: NSE stock symbol
        required: true
        default: 'DIXON'
        type: string

permissions:
  contents: write

concurrency:
  group: stockmind-chart
  cancel-in-progress: false

jobs:
  chart-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Validate chart engine
        run: python -m py_compile chart_engine.py

      - name: Generate chart analysis
        env:
          STOCK_SYMBOL: ${{ inputs.symbol }}
        run: |
          rm -f chart_data.json
          python chart_engine.py "$STOCK_SYMBOL"

      - name: Verify chart report
        run: |
          python - <<'PY'
          import json
          import math

          with open("chart_data.json") as f:
              data = json.load(f)

          candles = data["candles"]

          assert len(candles) >= 51

          for c in candles:
              for k in ["open", "high", "low", "close", "volume"]:
                  assert math.isfinite(c[k])

              assert c["low"] > 0
              assert c["high"] >= max(c["open"], c["close"])
              assert c["low"] <= min(c["open"], c["close"])
              assert c["volume"] >= 0

          dates = [c["date"] for c in candles]

          assert dates == sorted(set(dates))
          assert dates[-1] == data["price_date"]

          plan = data.get("reference_plan")

          if plan:
              assert (
                  0 < plan["stop_loss"]
                  < plan["entry_trigger"]
                  < plan["target"]
              )

          assert data["decision"] == "WAIT"

          print("Symbol:", data["symbol"])
          print("Candles:", len(candles))
          print("Price date:", data["price_date"])
          print("Trend:", data["trend"])
          print("Patterns:", data["patterns"])
          print("Trade plan:", plan)
          print("Chart report verified")
          PY

      - name: Upload chart report
        uses: actions/upload-artifact@v4
        with:
          name: stockmind-v7-chart
          path: chart_data.json
          if-no-files-found: error

      - name: Publish chart to website
        run: |
          git config user.name "StockMind AI"
          git config user.email "actions@users.noreply.github.com"

          git add chart_data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update StockMind AI 7.0 chart data"
            git push origin HEAD:main
          fi
