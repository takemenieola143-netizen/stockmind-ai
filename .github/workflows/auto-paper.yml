name: Auto paper portfolio
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/15 4-10 * * 1-5'
permissions:
  contents: read
concurrency:
  group: auto-paper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest test_auto_paper
  ledger:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python auto_paper.py
      - run: |
          git config user.name 'stockmind-paper-bot'
          git config user.email 'stockmind-paper-bot@users.noreply.github.com'
          git add auto_paper_state.json
          git diff --cached --quiet || (git commit -m 'Update virtual paper ledger' && git push)
